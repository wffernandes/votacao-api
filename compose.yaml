services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: votacao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d votacao"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/votacao
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      ELEGIBILIDADE_BASE_URL: ${ELEGIBILIDADE_BASE_URL:-https://user-info.herokuapp.com}
      ELEGIBILIDADE_TIMEOUT_SEGUNDOS: 3

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data: