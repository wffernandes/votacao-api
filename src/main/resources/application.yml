spring:
  application:
    name: votacao-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/votacao}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

integracao:
  elegibilidade:
    base-url: ${ELEGIBILIDADE_BASE_URL:https://user-info.herokuapp.com}
    timeout-segundos: ${ELEGIBILIDADE_TIMEOUT_SEGUNDOS:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never